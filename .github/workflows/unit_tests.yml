name: unit-tests

on:
    workflow_dispatch:
    push:
    pull_request:

jobs:
    check_lib_compilation:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install Node
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm

            -   name: Install Dependencies
                run: npm ci

            -   name: Compile Library
                run: npm run compile

    run_tests:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install Node
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm

            -   name: Install Dependencies
                run: npm ci

            -   name: Execute Unit Tests
                run: npm run test
